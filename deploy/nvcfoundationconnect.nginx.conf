server {
    server_name nvcfoundationconnect.online;
    server_tokens off;
    root /var/www/nvcfoundationconnect/dist;
    index index.html;

    # API and WebSocket traffic stays behind the local FastAPI listener.
    location ~ ^/(health|db-health|auth|users|projects|events|program-tracks|project-records|volunteers|volunteer-time-logs|volunteer-matches|partner-project-applications|messages|storage|admin|validation|attachments|docs|reports|notify|openapi.json|ws|api|notifications) {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser hardening for the static SPA shell and assets.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://accounts.google.com https://apis.google.com https://maps.googleapis.com https://maps.gstatic.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://nvcfoundationconnect.online https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.googleapis.com wss://nvcfoundationconnect.online; media-src 'self' data: blob: https:; frame-src 'self' https://accounts.google.com; form-action 'self' https://accounts.google.com" always;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/nvcfoundationconnect.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nvcfoundationconnect.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name nvcfoundationconnect.online;
    server_tokens off;
    return 301 https://nvcfoundationconnect.online$request_uri;
}

server {
    listen 443 ssl;
    server_name www.nvcfoundationconnect.online;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/nvcfoundationconnect.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nvcfoundationconnect.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://nvcfoundationconnect.online$request_uri;
}

server {
    listen 80;
    server_name www.nvcfoundationconnect.online;
    server_tokens off;
    return 301 https://nvcfoundationconnect.online$request_uri;
}
